name: Windows 中文版构建

on:
  workflow_dispatch:
  push:
    branches:
      - zh-cn-v0.30.0
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-windows-zh.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 编译 Windows x64
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: 整理便携版文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/aichat.exe dist/aichat.exe
          Copy-Item portable/启动中文版.bat dist/启动中文版.bat
          Copy-Item README.zh-CN.md dist/使用说明.md

      - name: 上传 Windows x64 便携版
        uses: actions/upload-artifact@v4
        with:
          name: aichat-v0.30.0-zh-cn-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
